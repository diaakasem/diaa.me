<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Diaa Kasem | Senior Software Engineer{% endblock %}</title>

  {% block head %}
  <meta name="p:domain_verify" content="196a16ded2c542dacee4eb88a37d09c4" />
  <link rel='shortcut icon' href='/images/favicon.ico'>
  <link rel='apple-touch-icon' href='/images/apple-touch-icon.png'>
  <link rel='apple-touch-icon' sizes='72x72' href='./images/apple-touch-icon-72x72.png'>
  <link rel='apple-touch-icon' sizes='114x114' href='/images/apple-touch-icon-114x114.png'>

  <link rel="stylesheet" id="o-responsive-css" href="/css/o-responsive.css" type="text/css" media="all">
  <link rel="stylesheet" id="themestyle-css" href="/style.css" type="text/css" media="all">
  <link href='http://fonts.googleapis.com/css?family=Lato:300,400,900,300italic,400italic,900italic' rel='stylesheet' type='text/css'>
  {% endblock %}
</head>

<body class="fullwidth boxed {% block body_class %}{% endblock %}" data-device="" data-maxcols="">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header id="site-header" class="site-header" role="banner">
    <div class="container wrap site-header-inner">
      <div class="site-identity">
        <a href="/" class="site-title">Diaa Kasem</a>
        <p class="site-tagline">
          Senior Software Engineer at
          <a href="https://www.meetsoci.com/" rel="noopener noreferrer">SOCi</a>.
        </p>
      </div>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/blog" class="blog-link">Blog</a>
      </nav>
    </div>
  </header>

  <section id="main-content" class="section main-body-container" role="main">
    {% block content %}{% endblock %}
  </section>

  <footer id="copyright" class="site-footer">
    <div class="container wrap">
      <div class="row">
        <div class="col dimfull text-center">
          <p>&copy; {{ now() | date(format="%Y") }} <em>Diaa Mohamed Kasem</em>.</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Minimal JavaScript -->
  <script type='text/javascript' src='/js/scripts.js'></script>
</body>
</html>
